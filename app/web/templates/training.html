{{define "content"}}
{{$t := .Team}}{{$tr := .Data.Training}}
<h2>{{weekday $tr.Day}} {{date $tr.Day}}</h2>
{{if .Data.Rows}}
<form method="post">
  <ul class="list">
    {{range .Data.Rows}}
    <li class="check" style="padding:0">
      <label class="check grow" style="display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:52px">
        <span class="num">{{if .Player.Number.Valid}}{{.Player.Number.Int64}}{{end}}</span>
        <span class="grow">{{.Player.DisplayName}} <span class="sub">{{.Player.FirstName}} {{.Player.LastName}}</span></span>
        <input type="checkbox" name="present" value="{{.Player.ID}}" {{if .Present}}checked{{end}}>
      </label>
    </li>
    {{end}}
  </ul>
  <label class="field" style="margin-top:12px"><span>Notas del entreno</span><textarea name="notes" rows="2">{{$tr.Notes}}</textarea></label>
  <div class="sticky-save"><button>Guardar asistencia (<span id="count">0</span>)</button></div>
</form>
<script>
  // Contador en vivo: se ve de un vistazo cuántos han venido.
  const boxes = document.querySelectorAll('input[name=present]');
  const count = () => document.getElementById('count').textContent = [...boxes].filter(b => b.checked).length;
  boxes.forEach(b => b.addEventListener('change', count)); count();
</script>
{{else}}
<p class="empty">No hay jugadores activos. <a href="/t/{{$t.ID}}/players">Añádelos aquí</a>.</p>
{{end}}
<form method="post" action="/t/{{$t.ID}}/trainings/{{$tr.ID}}/delete" onsubmit="return confirm('¿Borrar este entreno y su lista?')">
  <button class="danger small">Borrar entreno</button>
</form>
{{end}}
