{{define "content"}}
{{$t := .Team}}
{{with .Data.Boards}}
<ul class="list">
  {{range .}}
  <li><a class="grow" href="/t/{{$t.ID}}/boards/{{.ID}}">{{.Name}}<div class="sub">Modificada el {{date .UpdatedAt}}</div></a></li>
  {{end}}
</ul>
{{else}}
<p class="empty">Todavía no hay pizarras. Crea una para preparar jugadas o explicar movimientos.</p>
{{end}}

<details class="add" {{if not .Data.Boards}}open{{end}}>
  <summary class="btn">+ Nueva pizarra</summary>
  <form method="post" action="/t/{{$t.ID}}/boards" class="card">
    <label class="field"><span>Nombre *</span><input type="text" name="name" maxlength="24" placeholder="Salida de balón" required></label>
    <label class="field"><span>Empezar desde</span>
      <select name="origin">
        <optgroup label="Formación">
          {{range .Data.Formations}}<option value="f:{{.Name}}">{{.Name}}</option>{{end}}
        </optgroup>
        {{with .Data.Callups}}<optgroup label="Planteamiento de un partido">
          {{range .}}<option value="c:{{.ID}}">{{date .Day}}{{with .Rival}} · vs {{.}}{{end}} ({{.Formation}})</option>{{end}}
        </optgroup>{{end}}
        <option value="">Campo vacío</option>
      </select>
    </label>
    <button>Crear pizarra</button>
  </form>
</details>
{{end}}
