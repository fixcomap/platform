# Pipeline estándar de la org. Lo llama el ci.yml idéntico de cada repo
# (copia canónica en caller/ci.yml) y decide qué hacer:
#
#   resolve   catalog/<repo>.yaml de la misma versión de platform que este
#             workflow -> tipo de proyecto, config y etapa (preview | production).
#             Repo sin entrada en el catálogo: no se hace nada (no-action).
#   comunes   gitflow (solo PR) + gitleaks/trivy + higiene (scripts/higiene.sh), para cualquier tipo.
#   static    checks HTML/CSS + Cloudflare Pages (develop: preview; main: producción).
#   webapp    checks del runtime + imagen (trivy, cosign) + migraciones + Cloud Run con
#             infra/webapp (PR: solo build; develop: <service>-dev; main: <service> + tag
#             vVERSION) y, con webapp.front, el front en Pages tras la API (job static-deploy).
#   ok        check único que exigen los rulesets.
#
# Etapas por evento (static | webapp):
#   pull_request -> checks           | checks + build sin push
#   push develop -> checks + preview | despliegue en development
#   push main    -> checks + producción, ambos con aprobación del environment production
name: cicd

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

env:
  WRANGLER_VERSION: 4.132.0
  TOFU_VERSION: 1.12.6
  GCP_REGION: europe-west1
  # No son secretos: identifican el pool de WIF y la SA que despliega L2. Viven
  # aquí y no como variables de cada repo para que un repo nuevo no configure nada.
  GCP_WIF_PROVIDER: projects/582439706326/locations/global/workloadIdentityPools/github/providers/github-oidc
  GCP_PROJECT_ID: fixcomap-core
  GH_DEPLOYER_SA: gh-deployer@fixcomap-core.iam.gserviceaccount.com
  DOCKER_REPO: europe-west1-docker.pkg.dev/fixcomap-core/docker

jobs:
  resolve:
    name: resolve (catálogo)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      type: ${{ steps.catalog.outputs.type }}
      platform_ref: ${{ steps.ref.outputs.ref }}
      environment: ${{ steps.stage.outputs.environment }}
      deploy: ${{ steps.stage.outputs.deploy }}
      site_dir: ${{ steps.catalog.outputs.site_dir }}
      build_cmd: ${{ steps.catalog.outputs.build_cmd }}
      node_version: ${{ steps.catalog.outputs.node_version }}
      require_csp: ${{ steps.catalog.outputs.require_csp }}
      restricted: ${{ steps.catalog.outputs.restricted }}
      validate_html: ${{ steps.catalog.outputs.validate_html }}
      pages_project: ${{ steps.catalog.outputs.pages_project }}
      production_url: ${{ steps.catalog.outputs.production_url }}
      service: ${{ steps.stage.outputs.service }}
      runtime: ${{ steps.catalog.outputs.runtime }}
      public: ${{ steps.stage.outputs.public }}
      context: ${{ steps.catalog.outputs.context }}
      health_path: ${{ steps.catalog.outputs.health_path }}
      migrate: ${{ steps.catalog.outputs.migrate }}
      has_front: ${{ steps.catalog.outputs.has_front }}
      build_dir: ${{ steps.catalog.outputs.build_dir }}
      front_env: ${{ steps.stage.outputs.front_env }}
      site_url: ${{ steps.stage.outputs.site_url }}
      deploy_sa: ${{ steps.stage.outputs.deploy_sa }}
      state_bucket: ${{ steps.stage.outputs.state_bucket }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/workflows
          persist-credentials: false

      - name: versión de platform
        # La ref con la que el ci.yml del repo llama a este workflow: el catálogo
        # se lee de esa misma versión, así framework y catálogo nunca se desfasan.
        id: ref
        run: |
          file="${GITHUB_WORKFLOW_REF#*/*/}"; file="${file%@*}"
          ref=$(grep -oE 'fixcomap/platform/\.github/workflows/cicd\.yml@[^[:space:]#]+' "$file" | head -1 | cut -d@ -f2)
          [ -n "$ref" ] || { echo "::error file=$file::no llama a fixcomap/platform/.github/workflows/cicd.yml@<ref>"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "CALLER=$file" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fixcomap/platform
          ref: ${{ steps.ref.outputs.ref }}
          path: .platform
          sparse-checkout: |
            catalog
            caller
          persist-credentials: false

      - name: ci.yml estándar
        # Aviso, no fallo: el caller solo debe diferir en la versión.
        run: |
          norm() { sed -E 's#(cicd\.yml)@[^[:space:]#]+#\1@REF#' "$1"; }
          diff <(norm .platform/caller/ci.yml) <(norm "$CALLER") >/dev/null \
            || echo "::warning file=$CALLER::difiere de platform/caller/ci.yml; usar la copia canónica"

      - name: catálogo
        id: catalog
        run: |
          f=".platform/catalog/${GITHUB_REPOSITORY#*/}.yaml"
          if [ ! -f "$f" ]; then
            echo "type=none" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REPOSITORY no está en catalog/: no-action"
            echo "**$GITHUB_REPOSITORY** no está en el catálogo de platform: no-action" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          repo=$(yq -r '.repo' "$f")
          [ "$repo" = "$GITHUB_REPOSITORY" ] || { echo "::error::$f es de $repo, no de $GITHUB_REPOSITORY"; exit 1; }
          type=$(yq -r '.type' "$f")
          {
            echo "type=$type"
            if [ "$type" = static ]; then
              echo "build_dir=."
              echo "site_dir=$(yq -r '.static.site_dir // "public"' "$f")"
              echo "build_cmd=$(yq -r '.static.build_cmd // ""' "$f")"
              echo "node_version=$(yq -r '.static.node_version // "22"' "$f")"
              echo "require_csp=$(yq -r '.static.require_csp == false | not' "$f")"
              echo "pages_project=$(yq -r '.static.pages_project' "$f")"
              echo "production_url=https://$(yq -r '.static.hostnames[0]' "$f")"
              echo "restricted=$(yq -r '.static.restricted // false' "$f")"
              echo "validate_html=$(yq -r '.static.validate_html == false | not' "$f")"
            fi
            if [ "$type" = webapp ]; then
              echo "base_service=$(yq -r '.webapp.service' "$f")"
              echo "runtime=$(yq -r '.webapp.runtime // "go"' "$f")"
              echo "node_version=$(yq -r '.webapp.node_version // "22"' "$f")"
              echo "context=$(yq -r '.webapp.context // "."' "$f")"
              echo "health_path=$(yq -r '.webapp.health_path // "/health"' "$f")"
              echo "migrate=$(yq -r '.webapp.migrate // ""' "$f")"
              echo "has_front=$(yq -r '.webapp.front != null' "$f")"
              if [ "$(yq -r '.webapp.front != null' "$f")" = true ]; then
                d=$(yq -r '.webapp.front.dir // "."' "$f")
                echo "build_dir=$d"
                echo "site_dir=$d/$(yq -r '.webapp.front.site_dir // "dist"' "$f")"
                echo "build_cmd=$(yq -r '.webapp.front.build_cmd // "npm run build"' "$f")"
                echo "pages_project=$(yq -r '.webapp.front.pages_project' "$f")"
              fi
            fi
          } >> "$GITHUB_OUTPUT"
          { echo "## $GITHUB_REPOSITORY: \`$type\` (platform@${{ steps.ref.outputs.ref }})"; echo '```yaml'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: etapa
        id: stage
        env:
          TYPE: ${{ steps.catalog.outputs.type }}
          BASE_SERVICE: ${{ steps.catalog.outputs.base_service }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          # Un dispatch sobre main o develop es un redespliegue: mismo camino (y
          # misma aprobación) que el push. Sobre otra rama, como una PR.
          ev=false; case "$GITHUB_EVENT_NAME" in push|workflow_dispatch) ev=true ;; esac
          main=false; [ "$ev" = true ] && [ "$GITHUB_REF_NAME" = main ] && main=true
          develop=false; [ "$ev" = true ] && [ "$GITHUB_REF_NAME" = develop ] && develop=true
          deploy=true; [ "$FORK" = true ] && deploy=false
          case "$TYPE" in
            static)
              # Solo despliegan main y develop: el token de Pages no sale de ramas protegidas.
              if [ "$main" = true ]; then env=production
              elif [ "$develop" = true ]; then env=preview
              else env=none; deploy=false; fi ;;
            webapp)
              # Solo despliegan main y develop: una PR construye la imagen sin publicarla.
              if [ "$main" = true ]; then env=production; service="$BASE_SERVICE"
              elif [ "$develop" = true ]; then env=development; service="$BASE_SERVICE-dev"
              else env=none; deploy=false; fi
              echo "service=${service:-}" >> "$GITHUB_OUTPUT" ;;
            *) env=none; deploy=false ;;
          esac
          echo "environment=$env" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "etapa: **$env** (deploy=$deploy)" >> "$GITHUB_STEP_SUMMARY"

          # public del entorno (webapp.<entorno>.public pisa a webapp.public), como modules/catalog.
          f=".platform/catalog/${GITHUB_REPOSITORY#*/}.yaml"
          if [ "$TYPE" = webapp ]; then
            case "$env" in production|development) e=$env ;; *) e=development ;; esac
            public=$(yq -r ".webapp.$e.public // .webapp.public // false" "$f")
            echo "public=$public" >> "$GITHUB_OUTPUT"
            # Identidad de despliegue (infra/platform/deployers.tf): la de la webapp si
            # el servicio ya existe (public); si no, gh-deployer lo crea.
            sa="$GH_DEPLOYER_SA"; [ "$public" = true ] && sa="$BASE_SERVICE-deployer@$GCP_PROJECT_ID.iam.gserviceaccount.com"
            echo "deploy_sa=$sa" >> "$GITHUB_OUTPUT"
            echo "state_bucket=$GCP_PROJECT_ID-tfstate-${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
            echo "identidad: \`${sa%@*}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Front de una webapp: variables del build (VITE_*...) con {api_url} y
          # {front_url} del entorno; una PR construye con las de desarrollo.
          f=".platform/catalog/${GITHUB_REPOSITORY#*/}.yaml"
          if [ "$TYPE" = webapp ] && [ "$(yq -r '.webapp.front != null' "$f")" = true ]; then
            e=development; [ "$env" = production ] && e=production
            api="https://$(yq -r ".webapp.$e.hostnames[0]" "$f")"
            front="https://$(yq -r ".webapp.$e.front_hostnames[0]" "$f")"
            echo "site_url=$front" >> "$GITHUB_OUTPUT"
            {
              echo "front_env<<EOF_FRONT_ENV"
              yq -r '.webapp.front.env // {} | to_entries[] | .key + "=" + .value' "$f" \
                | sed -e "s#{api_url}#$api#g" -e "s#{front_url}#$front#g"
              echo "EOF_FRONT_ENV"
            } >> "$GITHUB_OUTPUT"
          fi

  # ---------- comunes ----------

  gitflow:
    name: gitflow (rama origen)
    needs: resolve
    if: needs.resolve.outputs.type != 'none' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Los rulesets no pueden restringir la rama de origen: main solo recibe
      # release/* y hotfix/*.
      - env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          case "$BASE" in
            main)    pat='^(release|hotfix)/' ;;
            develop) pat='^(feature|bugfix|release|hotfix)/' ;;
            *)       echo "rama base no contemplada: $BASE"; exit 1 ;;
          esac
          echo "$HEAD" | grep -Eq "$pat" || { echo "'$HEAD' no puede mergearse en '$BASE' (patrón: $pat)"; exit 1; }

  security:
    name: seguridad + higiene
    needs: resolve
    if: needs.resolve.outputs.type != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks escanea el historial; higiene, los commits de la PR
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fixcomap/platform
          ref: ${{ needs.resolve.outputs.platform_ref }}
          path: .platform
          sparse-checkout: scripts
          persist-credentials: false
      - name: higiene
        # Lo que nunca se versiona (IA, .env, estado, binarios, >5 MB) y commits con firma de IA.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git ls-files --error-unmatch .platform >/dev/null 2>&1 && { echo "::error::.platform está versionado"; exit 1; }
          bash .platform/scripts/higiene.sh
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git --no-banner --redact --exit-code 1 .
      - name: trivy fs (secret + misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ---------- static: Cloudflare Pages ----------

  static-checks:
    name: static (html + css)
    needs: resolve
    if: needs.resolve.outputs.type == 'static'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SITE_DIR: ${{ needs.resolve.outputs.site_dir }}
      BUILD_CMD: ${{ needs.resolve.outputs.build_cmd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.resolve.outputs.node_version }}
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: npm ci
        if: hashFiles('package-lock.json') != ''
        run: npm ci --no-audit --no-fund

      - name: build
        if: env.BUILD_CMD != ''
        run: |
          bash -euo pipefail -c "$BUILD_CMD"
          test -d "$SITE_DIR" || { echo "::error::el build no ha generado $SITE_DIR"; exit 1; }

      - name: validar HTML (W3C Nu)
        # static.validate_html: false solo para HTML generado por un tema de terceros.
        if: needs.resolve.outputs.validate_html != 'false'
        run: |
          docker run --rm -v "$PWD/$SITE_DIR:/site:ro" ghcr.io/validator/validator:24.10.17 \
            vnu --skip-non-html --errors-only --also-check-css /site

      - name: lint
        # Sitio con código propio (script build: React, TypeScript...): lint obligatorio.
        if: hashFiles('package.json') != ''
        run: |
          node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)" || { echo "sin build: HTML/CSS, lo validan W3C y stylelint"; exit 0; }
          node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)" \
            || { echo "::error file=package.json::falta el script \"lint\" (obligatorio en sitios con build)"; exit 1; }
          npm run -s lint

      - name: stylelint
        # Solo si el repo define el script.
        if: hashFiles('package.json') != ''
        run: npm run -s lint:css --if-present

      - name: _headers con CSP
        if: needs.resolve.outputs.require_csp == 'true'
        run: |
          f="$SITE_DIR/_headers"
          test -f "$f" || { echo "::error::falta $f"; exit 1; }
          grep -qE "Content-Security-Policy: default-src '(self|none)'" "$f" || { echo "::error::$f sin CSP con default-src 'self'|'none'"; exit 1; }
          grep -q "frame-ancestors 'none'" "$f" || { echo "::error::$f sin frame-ancestors 'none'"; exit 1; }

      - name: assets referenciados existen
        # Aviso, no fallo: fotos y PDFs se suben a mano.
        run: |
          while IFS=: read -r html ref; do
            path="${ref%%[?#]*}"
            [ -f "$SITE_DIR$path" ] || echo "::warning file=$html::falta $SITE_DIR$path (referenciado en $html)"
          done < <(grep -rHoE '(src|href)="/[^"/][^"]*"' --include='*.html' "$SITE_DIR" | sed -E 's/:(src|href)="/:/; s/"$//')

  # Sitio static, o front de una webapp (webapp.front) después de su API: el
  # front nuevo nunca llega antes que la API que necesita.
  static-deploy:
    # Nombre fijo: con el job saltado, GitHub muestra la expresión sin evaluar.
    name: static (pages)
    needs: [resolve, gitflow, security, static-checks, webapp-deploy]
    # gitflow solo corre en PR: skipped cuenta como bueno.
    if: >-
      !cancelled() && needs.resolve.outputs.deploy == 'true'
      && needs.security.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.gitflow.result)
      && ((needs.resolve.outputs.type == 'static' && needs.static-checks.result == 'success')
        || (needs.resolve.outputs.has_front == 'true' && needs.webapp-deploy.result == 'success'))
    runs-on: ubuntu-latest
    # Aprobación y secrets de Cloudflare: environment del repo caller.
    environment: ${{ needs.resolve.outputs.environment }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # En PR github.ref_name es "N/merge"; la rama real es head_ref.
      BRANCH: ${{ github.head_ref || github.ref_name }}
      PROJECT: ${{ needs.resolve.outputs.pages_project }}
      SITE_DIR: ${{ needs.resolve.outputs.site_dir }}
      BUILD_DIR: ${{ needs.resolve.outputs.build_dir }}
      BUILD_CMD: ${{ needs.resolve.outputs.build_cmd }}
      FRONT_ENV: ${{ needs.resolve.outputs.front_env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.resolve.outputs.node_version }}

      - name: build
        if: env.BUILD_CMD != ''
        working-directory: ${{ needs.resolve.outputs.build_dir }}
        run: |
          while IFS= read -r kv; do [ -n "$kv" ] && export "${kv?}"; done <<< "$FRONT_ENV"
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; fi
          bash -euo pipefail -c "$BUILD_CMD"
          test -d "$GITHUB_WORKSPACE/$SITE_DIR" || { echo "::error::el build no ha generado $SITE_DIR"; exit 1; }

      - name: wrangler pages deploy
        id: deploy
        # Despliega y solo si el proyecto no existe (8000007) lo crea y reintenta:
        # listar proyectos dispara el rate limit de Pages (10429). El provider de
        # OpenTofu no puede crear proyectos de direct upload (8000011); infra/dns
        # lo importa después desde el catálogo.
        run: |
          deploy() {
            npx --yes "wrangler@$WRANGLER_VERSION" pages deploy "$SITE_DIR" \
              --project-name "$PROJECT" \
              --branch "$BRANCH" \
              --commit-hash "$GITHUB_SHA" \
              --commit-message "$(git log -1 --format=%s)" \
              --commit-dirty=false > deploy.log 2>&1
          }
          if ! deploy; then
            cat deploy.log
            grep -qE 'Project not found|8000007|does not exist' deploy.log || exit 1
            echo "proyecto $PROJECT no existe: se crea"
            npx --yes "wrangler@$WRANGLER_VERSION" pages project create "$PROJECT" --production-branch main
            deploy || { cat deploy.log; exit 1; }
          fi
          cat deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          [ -n "$url" ] || { echo "::error::wrangler no ha devuelto URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "- rama \`$BRANCH\` → $url" >> "$GITHUB_STEP_SUMMARY"

      - name: smoke test
        env:
          # Dominio propio: el de producción de un static, o el del entorno del front de una webapp.
          # El de un front solo con public: true: hasta entonces su dominio no está en Pages (lo
          # añade el apply de dns posterior al primer deploy) y la API no es accesible.
          URLS: ${{ steps.deploy.outputs.url }} ${{ needs.resolve.outputs.environment == 'production' && needs.resolve.outputs.type == 'static' && needs.resolve.outputs.production_url || '' }} ${{ needs.resolve.outputs.public == 'true' && needs.resolve.outputs.site_url || '' }}
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          RESTRICTED: ${{ needs.resolve.outputs.restricted }}
        run: |
          # Hasta 5 min: el *.pages.dev de un proyecto recién creado tarda en resolver.
          # En desarrollo, en un static privado o en una URL *.pages.dev (las previews de un front
          # con desarrollo restringido están tras Access), un 302 al login de Access también vale.
          for u in $URLS; do
            ok=0
            for _ in $(seq 1 30); do
              out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 15 "$u/" || true)
              code=${out%% *}
              [ "$code" = "200" ] && { echo "$u → 200"; ok=1; break; }
              if { [ "$ENVIRONMENT" = development ] || [ "$RESTRICTED" = true ] || [[ "$u" == *.pages.dev ]]; } && [ "$code" = "302" ] && [[ "${out#* }" =~ ^https://[a-z0-9-]+\.cloudflareaccess\.com/cdn-cgi/access/login/ ]]; then
                echo "$u → 302 a Cloudflare Access"; ok=1; break
              fi
              sleep 10
            done
            [ "$ok" = 1 ] || { echo "::error::$u no responde 200 tras el deploy (último código: $code)"; exit 1; }
          done

  # ---------- webapp: Cloud Run ----------

  webapp-checks:
    # Nombres fijos: con el job saltado, GitHub muestra la expresión sin evaluar.
    name: webapp (checks)
    needs: resolve
    if: needs.resolve.outputs.type == 'webapp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Postgres de usar y tirar para los tests de integración: con las migraciones de
    # la app aplicadas (webapp.migrate) y en DATABASE_URL / TEST_DATABASE_URL para los tests.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pruebas
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: pruebas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pruebas" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://pruebas:pruebas@localhost:5432/pruebas
      TEST_DATABASE_URL: postgres://pruebas:pruebas@localhost:5432/pruebas?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: runtime soportado
        env:
          RUNTIME: ${{ needs.resolve.outputs.runtime }}
        run: |
          case "$RUNTIME" in go|node) ;; *) echo "::error::runtime '$RUNTIME' sin checks en cicd.yml"; exit 1 ;; esac

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.resolve.outputs.runtime == 'go'
        with:
          go-version-file: go.mod
      - name: gofmt
        if: needs.resolve.outputs.runtime == 'go'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        if: needs.resolve.outputs.runtime == 'go'
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: needs.resolve.outputs.runtime == 'go'
      - name: go test
        if: needs.resolve.outputs.runtime == 'go'
        run: go test -race ./...

      # node: cada paquete con package-lock.json (monorepo o no) pasa por npm ci,
      # lint y test (obligatorios: estándar de calidad de la org) y build si lo define.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.resolve.outputs.runtime == 'node'
        with:
          node-version: ${{ needs.resolve.outputs.node_version }}
      - name: migraciones en la base de pruebas
        if: needs.resolve.outputs.runtime == 'node' && needs.resolve.outputs.migrate != ''
        working-directory: ${{ needs.resolve.outputs.context }}
        env:
          MIGRATE: ${{ needs.resolve.outputs.migrate }}
        run: |
          npm ci --no-audit --no-fund
          bash -euo pipefail -c "$MIGRATE"

      - name: npm ci + lint + test + build
        if: needs.resolve.outputs.runtime == 'node'
        env:
          FRONT_ENV: ${{ needs.resolve.outputs.front_env }}
        run: |
          # Variables del build del front (webapp.front.env), como en el deploy.
          while IFS= read -r kv; do [ -n "$kv" ] && export "${kv?}"; done <<< "$FRONT_ENV"
          mapfile -t dirs < <(git ls-files '*package-lock.json' 'package-lock.json' | xargs -rn1 dirname | sort -u)
          [ "${#dirs[@]}" -gt 0 ] || { echo "::error::runtime node sin ningún package-lock.json"; exit 1; }
          falta=0
          for d in "${dirs[@]}"; do
            for s in lint test; do
              node -e "process.exit(require('./$d/package.json').scripts?.$s ? 0 : 1)" \
                || { echo "::error file=$d/package.json::falta el script \"$s\" (lint y test son obligatorios)"; falta=1; }
            done
          done
          [ "$falta" = 0 ] || exit 1
          for d in "${dirs[@]}"; do
            echo "::group::$d"
            (cd "$d" && npm ci --no-audit --no-fund && npm run lint && npm test && npm run --if-present build)
            echo "::endgroup::"
          done

  webapp-image:
    name: webapp (imagen)
    needs: resolve
    if: needs.resolve.outputs.type == 'webapp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC para GCP y para la firma keyless de cosign
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      SERVICE: ${{ needs.resolve.outputs.service }}
      DEPLOY: ${{ needs.resolve.outputs.deploy }}
      CONTEXT: ${{ needs.resolve.outputs.context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: build
        # --provenance=false: sin manifiestos de attestation, que en Artifact
        # Registry aparecen como versiones sin tag y ocupan cuota.
        # Paquete por servicio: keep-latest-5 de Artifact Registry cuenta por
        # paquete y los pushes de develop no desplazan las imágenes de producción.
        run: |
          echo "IMAGE_REF=$DOCKER_REPO/${SERVICE:-pr}:${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          docker build --provenance=false -t "$DOCKER_REPO/${SERVICE:-pr}:${GITHUB_SHA::12}" "$CONTEXT"

      - name: trivy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

      - name: auth GCP (deployer)
        if: env.DEPLOY == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ needs.resolve.outputs.deploy_sa }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: env.DEPLOY == 'true'

      - name: push
        id: push
        if: env.DEPLOY == 'true'
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE_REF"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_REF")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "imagen: $digest" >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.DEPLOY == 'true'

      - name: cosign sign (keyless)
        # Firma por digest con la identidad OIDC del workflow.
        if: env.DEPLOY == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$DIGEST"

  webapp-deploy:
    name: webapp (deploy)
    needs: [resolve, gitflow, security, webapp-checks, webapp-image]
    if: >-
      !cancelled() && needs.resolve.outputs.type == 'webapp' && needs.resolve.outputs.deploy == 'true'
      && needs.security.result == 'success' && needs.webapp-checks.result == 'success'
      && needs.webapp-image.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.gitflow.result)
    runs-on: ubuntu-latest
    # production: aprobación del environment del repo; development: sin protección.
    environment: ${{ needs.resolve.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.resolve.outputs.service }}
      cancel-in-progress: false
    permissions:
      contents: write # tag vVERSION
      id-token: write
    env:
      SERVICE: ${{ needs.resolve.outputs.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # L2 y catálogo de la misma versión de platform que este workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fixcomap/platform
          ref: ${{ needs.resolve.outputs.platform_ref }}
          path: .platform
          sparse-checkout: |
            catalog
            modules
            infra/webapp
          persist-credentials: false

      - name: auth GCP (deployer)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ needs.resolve.outputs.deploy_sa }}

      # webapp.migrate: antes del apply, así la revisión nueva arranca con el esquema
      # que necesita. Si falla, no se despliega y sigue la revisión anterior.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.resolve.outputs.migrate != '' && needs.resolve.outputs.runtime == 'node'
        with:
          node-version: ${{ needs.resolve.outputs.node_version }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: needs.resolve.outputs.migrate != ''

      - name: migraciones
        if: needs.resolve.outputs.migrate != ''
        working-directory: ${{ needs.resolve.outputs.context }}
        env:
          MIGRATE: ${{ needs.resolve.outputs.migrate }}
        run: |
          DATABASE_URL=$(gcloud secrets versions access latest --secret "$SERVICE-database-url-direct")
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          [ "${{ needs.resolve.outputs.runtime }}" = node ] && npm ci --no-audit --no-fund
          bash -euo pipefail -c "$MIGRATE"

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: apply infra/webapp
        id: apply
        working-directory: .platform/infra/webapp
        env:
          TF_VAR_service: ${{ env.SERVICE }}
          TF_VAR_image: ${{ needs.webapp-image.outputs.digest }}
        run: |
          tofu init -input=false -backend-config="bucket=${{ needs.resolve.outputs.state_bucket }}" -backend-config="prefix=$SERVICE"
          tofu plan -input=false -no-color -out=tfplan
          { echo "## apply infra/webapp ($SERVICE)"; echo '```hcl'; tofu show -no-color tfplan; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          tofu apply -input=false tfplan
          echo "url=$(tofu output -raw service_url)" >> "$GITHUB_OUTPUT"
          echo "public_url=$(tofu output -raw public_url)" >> "$GITHUB_OUTPUT"
          echo "url: $(tofu output -raw service_url)" >> "$GITHUB_STEP_SUMMARY"

      - name: smoke test
        # La revisión solo queda lista si health_path pasó la startup probe; esto
        # comprueba además DNS, certificado y mapping. Sin public aún no hay
        # acceso público que probar.
        if: needs.resolve.outputs.public == 'true'
        env:
          URL: ${{ steps.apply.outputs.public_url }}${{ needs.resolve.outputs.health_path }}
        run: |
          for _ in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$URL" || true)
            [ "$code" = "200" ] && { echo "$URL → 200"; exit 0; }
            sleep 10
          done
          echo "::error::$URL no responde 200 tras el deploy (último código: $code)"; exit 1

      - name: tag vVERSION
        # Solo producción y solo si no existe: un hotfix sin cambio de VERSION no re-etiqueta.
        if: needs.resolve.outputs.environment == 'production' && hashFiles('VERSION') != ''
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then echo "tag $v ya existe"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "$v"
          git push origin "$v"

  # ---------- resultado ----------

  # Único check que exigen los rulesets, igual para todos los repos y tipos: los
  # jobs propios de cada tipo pueden cambiar sin tocar ningún ruleset. skipped
  # cuenta como bueno (no aplica a este tipo/evento); failure o cancelled, no.
  ok:
    name: ok
    needs: [resolve, gitflow, security, static-checks, static-deploy, webapp-checks, webapp-image, webapp-deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "resultados: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::algún job ha terminado en $r"; exit 1 ;; esac
          done
